# OrangeFox 16.0 builder for Xiaomi Beryl
# Android 16 / BP2A / API 36
# Final vendor_boot merge is performed manually.
name: OrangeFox-16.0-beryl

on:
  workflow_dispatch:
    inputs:
      device_tree_ref:
        description: "Device tree branch/tag/SHA"
        required: false
        default: "main"
      build_type:
        description: "Build type"
        required: false
        default: "eng"

concurrency:
  group: ofox16-beryl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build OrangeFox fox_16.0 (beryl)
    runs-on: ubuntu-26.04
    timeout-minutes: 360

    env:
      FOX_BRANCH: "fox_16.0"
      FOX_PATH: ${{ github.workspace }}/orangefox_16
      DEVICE_TREE_REPO: "https://github.com/sairajkandkar007/android_device_xiaomi_beryl_ofox16.git"
      DEVICE_TREE_PATH: "device/xiaomi/beryl"
      LUNCH_TARGET: "fox_beryl-bp2a-eng"
      FOX_BUILD_DEVICE: "beryl"

    steps:
      - name: Pandora-style runner cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Inspect runner
        run: |
          set -eux
          echo "=== CPU ==="
          nproc --all
          echo "=== MEMORY ==="
          free -h
          echo "=== STORAGE ==="
          df -h /
          uname -a

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git-core git-lfs gnupg flex bison build-essential make cmake \
            zip unzip curl wget aria2 rsync cpio bc bzip2 xz-utils \
            zlib1g-dev libc6-dev-i386 lib32z1-dev libncurses-dev lib32ncurses-dev \
            libncurses6 libtinfo6 lib32ncurses6 lib32tinfo6 \
            libx11-dev x11proto-core-dev libgl1-mesa-dev libxml2-utils xsltproc \
            libssl-dev libelf-dev liblz4-tool libzstd-dev device-tree-compiler \
            fontconfig python3 python-is-python3 imagemagick pngcrush \
            lzop squashfs-tools schedtool openjdk-17-jdk ccache jq \
            linux-modules-extra-$(uname -r) zram-tools
          git lfs install
          sudo apt-get autoclean >/dev/null || true
          sudo apt-get autoremove -qy 2>/dev/null || true
          sudo rm -rf /var/cache/apt/archives/ 2>/dev/null || true

      - name: Setup zram
        run: |
          sudo modprobe zram
          sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
          sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
          sudo systemctl restart zramswap
          zramctl

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.email "builder@github-actions.local"
          git config --global user.name "OrangeFox Beryl Builder"
          git config --global color.ui false
          git config --global trailer.sign.key ""

      - name: Initialize OrangeFox 16.0 manifest
        run: |
          rm -rf "${FOX_PATH}"
          mkdir -p "${FOX_PATH}"
          cd "${FOX_PATH}"
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b "${FOX_BRANCH}" --depth=1

      - name: Sync OrangeFox 16.0 sources
        run: |
          cd "${FOX_PATH}"
          REPO_JOBS="$(nproc --all)"
          echo "Using ${REPO_JOBS} parallel repo jobs"
          repo sync --current-branch --no-tags --optimized-fetch --prune --force-sync --jobs="${REPO_JOBS}"

      - name: Clone device tree
        run: |
          mkdir -p "${FOX_PATH}/device/xiaomi"
          git clone --depth=1 --branch "${{ inputs.device_tree_ref || 'main' }}" \
            "${DEVICE_TREE_REPO}" "${FOX_PATH}/${DEVICE_TREE_PATH}"
          cd "${FOX_PATH}/${DEVICE_TREE_PATH}"
          git lfs pull || true
          echo "=== Device tree files ==="
          ls -la
          test -f BoardConfig.mk
          test -f AndroidProducts.mk
          test -f fox_beryl.mk
          test -f twrp_beryl.mk || echo "WARNING: twrp_beryl.mk missing (OF build still OK)"
          test -f device.mk

      - name: Verify Android 16 BP2A configuration
        run: |
          cd "${FOX_PATH}/${DEVICE_TREE_PATH}"
          grep -q "fox_beryl-bp2a-eng" AndroidProducts.mk
          ! grep -q "fox_beryl-ap2a-eng" AndroidProducts.mk
          echo "BP2A product registration verified."

      - name: Configure ccache
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.ccache"
          export CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
          export CCACHE_COMPRESS=1
          ccache -M 120G
          ccache -z
          ccache -s

      - name: Build recovery ramdisk
        run: |
          cd "${FOX_PATH}"
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export FOX_BUILD_DEVICE="${FOX_BUILD_DEVICE}"
          export USE_CCACHE=1
          export CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
          export CCACHE_EXEC="$(command -v ccache)"
          export CCACHE_COMPRESS=1
          BUILD_JOBS="$(nproc --all)"
          echo "Using ${BUILD_JOBS} build jobs"
          : > "${GITHUB_WORKSPACE}/build.log"
          BUILD_STATUS=1
          if command -v mka >/dev/null 2>&1; then
            mka recoveryimage -j"${BUILD_JOBS}" 2>&1 | tee -a "${GITHUB_WORKSPACE}/build.log"
            BUILD_STATUS=${PIPESTATUS[0]}
          fi
          if [ "${BUILD_STATUS}" -ne 0 ]; then
            m recoveryimage -j"${BUILD_JOBS}" 2>&1 | tee -a "${GITHUB_WORKSPACE}/build.log"
            BUILD_STATUS=${PIPESTATUS[0]}
          fi
          set -e
          exit "${BUILD_STATUS}"

      - name: Validate recovery output
        if: success()
        run: |
          OUT="${FOX_PATH}/out/target/product/beryl"
          test -f "${OUT}/ramdisk-recovery.img"
          ls -lh "${OUT}/ramdisk-recovery.img"
          sha256sum "${OUT}/ramdisk-recovery.img"
          ccache -s || true
          df -h /

      - name: Collect artifacts
        if: success()
        run: |
          OUT="${FOX_PATH}/out/target/product/beryl"
          mkdir -p "${{ github.workspace }}/artifacts"
          cp -v "${OUT}/ramdisk-recovery.img" "${GITHUB_WORKSPACE}/artifacts/"
          cp -v "${GITHUB_WORKSPACE}/build.log" "${GITHUB_WORKSPACE}/artifacts/"
          ls -lh "${GITHUB_WORKSPACE}/artifacts/"

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-16.0-beryl-recovery
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
