name: OrangeFox-16.0-beryl

on:
  push:
    branches:
      - main
      - ofox-16.0
  workflow_dispatch:
    inputs:
      device_tree_ref:
        description: "Device tree branch/tag/SHA"
        required: false
        default: "ofox-16.0"
      build_type:
        description: "Build type"
        required: false
        default: "eng"

concurrency:
  group: ofox16-beryl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build OrangeFox fox_16.0 (beryl)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      FOX_BRANCH: "fox_16.0"
      FOX_PATH: ${{ github.workspace }}/orangefox_16
      DEVICE_TREE_REPO: "https://github.com/sairajkandkar007/android_device_xiaomi_beryl_ofox16.git"
      DEVICE_TREE_PATH: "device/xiaomi/beryl"
      LUNCH_TARGET: "fox_beryl-bp2a-eng"
      FOX_BUILD_DEVICE: "beryl"

    steps:
      - name: Maximize Runner Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Set Up Build Environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aria2 git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 libncurses5-dev lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig python3 python3-pip bc libssl-dev rsync ccache \
            openjdk-11-jdk

          git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master ~/ofox_scripts
          sudo bash ~/ofox_scripts/setup/android_build_env.sh
          rm -rf ~/ofox_scripts

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure Git
        run: |
          git config --global user.email "builder@github-actions.local"
          git config --global user.name "OrangeFox Beryl Builder"
          git config --global color.ui false

      - name: Initialize official OrangeFox manifest
        run: |
          rm -rf "${FOX_PATH}"
          mkdir -p "${FOX_PATH}"
          cd "${FOX_PATH}"
          repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b "${FOX_BRANCH}"

      - name: Sync official OrangeFox sources
        run: |
          cd "${FOX_PATH}"
          repo sync \
            --current-branch \
            --no-tags \
            --optimized-fetch \
            --prune \
            --force-sync \
            --no-clone-bundle \
            --no-use-superproject \
            -j$(nproc --all)

      - name: Clone device tree
        run: |
          mkdir -p "${FOX_PATH}/${DEVICE_TREE_PATH}"
          git clone --depth=1 --branch "${{ inputs.device_tree_ref || 'ofox-16.0' }}" \
            "${DEVICE_TREE_REPO}" "${FOX_PATH}/${DEVICE_TREE_PATH}"
          cd "${FOX_PATH}/${DEVICE_TREE_PATH}"
          git lfs pull || true
          test -f BoardConfig.mk && test -f AndroidProducts.mk

      - name: Configure ccache
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.ccache"
          export CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
          export CCACHE_COMPRESS=1
          ccache -M 50G
          ccache -z

      - name: Build Recovery Ramdisk & Vendor Boot
        run: |
          cd "${FOX_PATH}"
          source build/envsetup.sh
          
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export FOX_BUILD_DEVICE="${FOX_BUILD_DEVICE}"
          export USE_CCACHE=1
          export CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
          export CCACHE_EXEC="$(command -v ccache)"
          export CCACHE_COMPRESS=1

          echo "Executing lunch for target: ${LUNCH_TARGET}"
          lunch "${LUNCH_TARGET}" || lunch "fox_${FOX_BUILD_DEVICE}-eng"

          TOTAL_CPUS="$(nproc --all)"
          BUILD_JOBS="$((TOTAL_CPUS > 2 ? TOTAL_CPUS - 1 : TOTAL_CPUS))"
          echo "Building with ${BUILD_JOBS} threads"

          OUT_DIR="${FOX_PATH}/out/target/product/${FOX_BUILD_DEVICE}"
          : > "${GITHUB_WORKSPACE}/build.log"

          if command -v mka >/dev/null 2>&1; then
            mka vendorbootimage "${OUT_DIR}/ramdisk-recovery.img" -j"${BUILD_JOBS}" 2>&1 | tee -a "${GITHUB_WORKSPACE}/build.log"
          else
            m vendorbootimage "${OUT_DIR}/ramdisk-recovery.img" -j"${BUILD_JOBS}" 2>&1 | tee -a "${GITHUB_WORKSPACE}/build.log"
          fi

      - name: Validate recovery ramdisk output
        run: |
          OUT="${FOX_PATH}/out/target/product/beryl"
          if [ ! -s "${OUT}/ramdisk-recovery.img" ]; then
            echo "Searching for built ramdisk..."
            find "${FOX_PATH}/out" -name "*recovery*" -o -name "ramdisk*"
            exit 1
          fi
          echo "=== Built Ramdisk Found ==="
          ls -lh "${OUT}/ramdisk-recovery.img"
          sha256sum "${OUT}/ramdisk-recovery.img"

      - name: Collect artifacts
        if: success()
        run: |
          OUT="${FOX_PATH}/out/target/product/beryl"
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          cp -v "${OUT}/ramdisk-recovery.img" "${GITHUB_WORKSPACE}/artifacts/" || true
          [ -f "${OUT}/vendor_boot.img" ] && cp -v "${OUT}/vendor_boot.img" "${GITHUB_WORKSPACE}/artifacts/" || true
          cp -v "${GITHUB_WORKSPACE}/build.log" "${GITHUB_WORKSPACE}/artifacts/"
          cd "${GITHUB_WORKSPACE}/artifacts"
          sha256sum * > SHA256SUMS
          ls -lh "${GITHUB_WORKSPACE}/artifacts/"

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-16.0-beryl-recovery
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
          
