# TWRP 14.1 builder for Xiaomi Beryl (vendor_boot recovery)
# Uses the SAME OrangeFox-oriented device tree with a temporary workspace-only
# compatibility layer (scripts/twrp-compat.sh). Tree on GitHub is never modified.
#
# Lunch: twrp_beryl-bp2a-eng
# Output: vendor_boot.img
#
name: TWRP-14.1-beryl

on:
  workflow_dispatch:
    inputs:
      device_tree_ref:
        description: "Device tree branch/tag/SHA"
        required: false
        default: "main"

concurrency:
  group: twrp-beryl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TWRP 14.1 (beryl)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      TWRP_PATH: ${{ github.workspace }}/twrp
      DEVICE_TREE_REPO: "https://github.com/sairajkandkar007/android_device_xiaomi_beryl_ofox16.git"
      DEVICE_TREE_PATH: "device/xiaomi/beryl"
      LUNCH_TARGET: "twrp_beryl-bp2a-eng"

    steps:
      - name: Checkout builder (for scripts)
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip unzip curl \
            zlib1g-dev libc6-dev-i386 libncurses6 x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip fontconfig python3 python-is-python3 git-lfs \
            libssl-dev bc rsync schedtool libwxgtk3.2-dev imagemagick \
            lzop pngcrush squashfs-tools openjdk-17-jdk ccache jq wget
          git lfs install

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.email "builder@github-actions.local"
          git config --global user.name "TWRP Beryl Builder"
          git config --global color.ui false

      - name: Init TWRP 14.1 minimal manifest
        run: |
          mkdir -p "${TWRP_PATH}"
          cd "${TWRP_PATH}"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14.1 --depth=1

      - name: Sync TWRP sources
        run: |
          cd "${TWRP_PATH}"
          repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags

      - name: Clone device tree
        run: |
          mkdir -p "${TWRP_PATH}/device/xiaomi"
          git clone --depth=1 --branch "${{ inputs.device_tree_ref || 'main' }}" \
            "${DEVICE_TREE_REPO}" "${TWRP_PATH}/${DEVICE_TREE_PATH}"
          cd "${TWRP_PATH}/${DEVICE_TREE_PATH}"
          git lfs pull || true
          test -f BoardConfig.mk
          test -f AndroidProducts.mk
          test -f twrp_beryl.mk
          test -f device.mk

      - name: Apply temporary TWRP compatibility layer
        run: |
          chmod +x "${{ github.workspace }}/scripts/twrp-compat.sh"
          "${{ github.workspace }}/scripts/twrp-compat.sh" apply \
            "${TWRP_PATH}/${DEVICE_TREE_PATH}"
          echo "=== AndroidProducts.mk (temp) ==="
          cat "${TWRP_PATH}/${DEVICE_TREE_PATH}/AndroidProducts.mk"

      - name: Build vendorbootimage
        run: |
          cd "${TWRP_PATH}"
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch "${LUNCH_TARGET}"
          mka adbd vendorbootimage -j"$(nproc --all)"
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "============================================================"
            echo "TWRP BUILD FAILED (exit $RC)"
            echo "Do NOT rewrite the device tree yet."
            echo "Capture the first meaningful error and add only the"
            echo "required temporary conversion, then rebuild."
            echo "============================================================"
            exit $RC
          fi

      - name: Restore device tree (discard temp conversion)
        if: always()
        run: |
          "${{ github.workspace }}/scripts/twrp-compat.sh" restore \
            "${TWRP_PATH}/${DEVICE_TREE_PATH}" || true

      - name: Collect artifacts
        if: success()
        run: |
          OUT="${TWRP_PATH}/out/target/product/beryl"
          mkdir -p "${{ github.workspace }}/artifacts"
          if [ -f "${OUT}/vendor_boot.img" ]; then
            cp -v "${OUT}/vendor_boot.img" "${{ github.workspace }}/artifacts/"
          else
            echo "ERROR: vendor_boot.img not found"
            find "${TWRP_PATH}/out/target/product" -name "*.img" 2>/dev/null | head -50
            exit 1
          fi
          ls -lh "${{ github.workspace }}/artifacts/"

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-14.1-beryl-vendor_boot
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
